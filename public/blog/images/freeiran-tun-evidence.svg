<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Evidence ladder of five rungs from config check to physical host with the top rung open, above a TUN adapter and its route table">
  <rect width="1200" height="630" fill="#050505"/>
  <g stroke="rgba(255,255,255,0.035)" stroke-width="1">
    <path d="M60 90h1080M60 180h1080M60 270h1080M60 360h1080M60 450h1080M60 540h1080"/>
    <path d="M150 60v510M270 60v510M390 60v510M510 60v510M630 60v510M750 60v510M870 60v510M990 60v510M1110 60v510"/>
  </g>

  <!-- the evidence ladder: five rungs, the physical-host rung left open -->
  <path d="M300 120v380" stroke="rgba(255,32,32,0.5)" stroke-width="2"/>
  <path d="M560 120v380" stroke="rgba(255,32,32,0.5)" stroke-width="2"/>

  <g stroke-width="14" stroke-linecap="round">
    <path d="M300 140h260" stroke="#ff2020"/>
    <path d="M300 236h260" stroke="rgba(255,32,32,0.85)"/>
    <path d="M300 332h260" stroke="rgba(255,32,32,0.7)"/>
    <path d="M300 428h260" stroke="rgba(255,32,32,0.55)"/>
    <path d="M300 500h260" stroke="rgba(255,32,32,0.3)" stroke-dasharray="18 12"/>
  </g>
  <g fill="rgba(255,70,56,0.55)">
    <rect x="620" y="132" width="120" height="6"/>
    <rect x="620" y="228" width="150" height="6"/>
    <rect x="620" y="324" width="104" height="6"/>
    <rect x="620" y="420" width="138" height="6"/>
    <rect x="620" y="492" width="164" height="6"/>
  </g>
  <path d="M620 160h56M620 256h84M620 352h48M620 448h70M620 520h60" stroke="rgba(255,70,56,0.3)" stroke-width="4"/>

  <!-- TUN adapter: the observed session interface -->
  <rect x="856" y="140" width="248" height="120" fill="none" stroke="rgba(255,32,32,0.5)" stroke-width="2"/>
  <g fill="none" stroke="rgba(255,70,56,0.55)" stroke-width="1.5">
    <rect x="884" y="168" width="88" height="26"/>
    <rect x="884" y="208" width="140" height="26"/>
  </g>
  <path d="M990 182h70" stroke="rgba(255,70,56,0.4)" stroke-width="3" stroke-dasharray="5 6"/>

  <!-- route table: the TUN owns the covering routes -->
  <rect x="856" y="300" width="248" height="120" fill="rgba(255,32,32,0.05)" stroke="rgba(255,32,32,0.5)" stroke-width="2"/>
  <g fill="rgba(255,70,56,0.55)">
    <rect x="884" y="326" width="150" height="6"/>
    <rect x="884" y="348" width="110" height="6"/>
    <rect x="884" y="370" width="130" height="6"/>
  </g>
  <path d="M884 392h36m12 0h36" stroke="rgba(255,70,56,0.5)" stroke-width="4"/>
  <path d="M956 392h36" stroke="rgba(255,70,56,0.25)" stroke-width="4"/>

  <!-- traffic proof: a real request flowing through -->
  <path d="M980 260v40" stroke="rgba(255,70,56,0.7)" stroke-width="2"/>
  <path d="M980 300l-8 -6v12z" fill="#ff2020" stroke="none"/>
  <path d="M980 420v74" stroke="rgba(255,70,56,0.45)" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- ladder to the system surfaces -->
  <path d="M560 500l296 -284" stroke="rgba(255,70,56,0.35)" stroke-width="1.5" fill="none" stroke-dasharray="4 7"/>
</svg>

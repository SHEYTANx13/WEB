<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="A five-tier stack diagram of the AI Instructions architecture">
  <rect width="1200" height="630" fill="#050505"/>
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <path d="M0 105h1200M0 315h1200M0 525h1200"/>
    <path d="M300 0v630M600 0v630M900 0v630"/>
  </g>

  <!-- Tier 1: master constitution (brightest, top) -->
  <rect x="260" y="88" width="680" height="86" rx="8" fill="rgba(16,18,24,0.9)" stroke="rgba(255,70,56,0.75)"/>

  <!-- Tier 2: REP and USEF -->
  <rect x="260" y="196" width="326" height="92" rx="8" fill="rgba(16,18,24,0.9)" stroke="rgba(255,32,32,0.45)"/>
  <rect x="614" y="196" width="326" height="92" rx="8" fill="rgba(16,18,24,0.9)" stroke="rgba(255,32,32,0.45)"/>

  <!-- Tier 3: dynamic operational modules -->
  <rect x="260" y="310" width="680" height="80" rx="8" fill="rgba(16,18,24,0.9)" stroke="rgba(255,32,32,0.3)"/>

  <!-- Tier 4: host runtime (dashed — physical boundary) -->
  <rect x="260" y="412" width="680" height="80" rx="8" fill="rgba(16,18,24,0.9)" stroke="rgba(255,32,32,0.4)" stroke-dasharray="8 5"/>

  <!-- Vertical flow line -->
  <path d="M600 174v-6" stroke="rgba(255,32,32,0.6)" stroke-width="2"/>
  <path d="M423 288v22" stroke="rgba(255,32,32,0.6)" stroke-width="2"/>
  <path d="M777 288v22" stroke="rgba(255,32,32,0.6)" stroke-width="2"/>
  <path d="M600 390v22" stroke="rgba(255,32,32,0.6)" stroke-width="2"/>

  <g font-family="monospace" font-weight="bold" text-anchor="middle">
    <!-- Tier 1 labels -->
    <text x="600" y="122" font-size="19" fill="#f5f7fb">AI INSTRUCTIONS</text>
    <text x="600" y="150" font-size="11" fill="#c4c9d4" letter-spacing="3">MASTER CONSTITUTION — GOVERN</text>

    <!-- Tier 2 labels -->
    <text x="423" y="230" font-size="17" fill="#f5f7fb">REP</text>
    <text x="423" y="254" font-size="10" fill="#7f8796" letter-spacing="2">REASONING — VERIFY</text>
    <text x="423" y="272" font-size="9" fill="#7f8796" letter-spacing="1">test-time compute</text>
    <text x="777" y="230" font-size="17" fill="#f5f7fb">USEF</text>
    <text x="777" y="254" font-size="10" fill="#7f8796" letter-spacing="2">ENHANCEMENT — IMPROVE</text>
    <text x="777" y="272" font-size="9" fill="#7f8796" letter-spacing="1">metacognition</text>

    <!-- Tier 3 labels -->
    <text x="600" y="342" font-size="13" fill="#f5f7fb" letter-spacing="2">DYNAMIC OPERATIONAL MODULES</text>
    <text x="600" y="366" font-size="10" fill="#7f8796" letter-spacing="2">specialists · execution chains · verification engines</text>

    <!-- Tier 4 labels -->
    <text x="600" y="444" font-size="13" fill="#f5f7fb" letter-spacing="2">HOST RUNTIME INFRASTRUCTURE</text>
    <text x="600" y="468" font-size="10" fill="#7f8796" letter-spacing="2">sandboxes · policies · snapshots · human gates</text>
  </g>

  <!-- MCD / HRR boundary markers -->
  <g font-family="monospace" font-weight="bold">
    <text x="968" y="120" font-size="10" fill="rgba(255,70,56,0.9)" letter-spacing="2">MCD</text>
    <text x="968" y="452" font-size="10" fill="rgba(255,70,56,0.9)" letter-spacing="2">HRR</text>
  </g>
  <g stroke="rgba(255,70,56,0.35)" stroke-width="1">
    <path d="M954 510h34"/>
    <path d="M954 510v-36" stroke-dasharray="4 4"/>
    <path d="M988 510v-36" stroke-dasharray="4 4"/>
  </g>

  <!-- Core mark -->
  <circle cx="600" cy="548" r="7" fill="#ff2020"/>
  <path d="M470 548h118" stroke="rgba(255,32,32,0.35)" stroke-width="2"/>
  <path d="M612 548h118" stroke="rgba(255,32,32,0.35)" stroke-width="2"/>
  <g font-family="monospace" font-weight="bold" text-anchor="middle">
    <text x="423" y="542" font-size="9" fill="#7f8796" letter-spacing="2">UNDERSTAND</text>
    <text x="777" y="542" font-size="9" fill="#7f8796" letter-spacing="2">VERIFY</text>
    <text x="600" y="586" font-size="10" fill="#7f8796" letter-spacing="3">EVALUATE</text>
  </g>
</svg>
